<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de Glow y Sombra -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="bladeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.8" />
    </filter>

    <!-- Gradientes de Fondo y Bordes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de Servidores (Alta Gama) -->
    <linearGradient id="bladeGradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bladeGradMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bladeGradBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bladeBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Resplandor Neón de Acento -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Reflejo Especular Superior (Efecto Cristal) -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- CONTENEDOR BASE / SQUIRCLE -->
  <g filter="url(#dropShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
    <!-- Borde con gradiente y resplandor -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.9" />
    <!-- Aura Radial Central -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#centerAura)" />
  </g>

  <!-- LINEAS DE CIRCUITO DE FONDO (SUAVES) -->
  <g opacity="0.25">
    <path d="M 100 130 L 160 130 L 200 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="90" r="4" fill="#38bdf8" />
    
    <path d="M 412 130 L 352 130 L 312 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="312" cy="90" r="4" fill="#38bdf8" />

    <path d="M 100 382 L 160 382 L 200 422" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="422" r="4" fill="#0ea5e9" />

    <path d="M 412 382 L 352 382 L 312 422" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="312" cy="422" r="4" fill="#0ea5e9" />
  </g>

  <!-- RACK DE SERVIDORES DE ALTA GAMA (CENTRAL) -->
  <g filter="url(#bladeShadow)">

    <!-- ================= BLADE 1 (SUPERIOR) ================= -->
    <g transform="translate(0, 0)">
      <!-- Chasis del Servidor -->
      <rect x="96" y="126" width="320" height="68" rx="16" fill="url(#bladeGradTop)" stroke="url(#bladeBorderGrad)" stroke-width="2.5" />
      <!-- Bisel de Luz Superior -->
      <line x1="112" y1="128" x2="400" y2="128" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
      
      <!-- LEDs de Estado (Izquierda) -->
      <circle cx="132" cy="160" r="8" fill="#10b981" filter="url(#neonGlow)" />
      <circle cx="132" cy="160" r="5" fill="#34d399" />
      <circle cx="132" cy="160" r="2.5" fill="#ffffff" />

      <circle cx="156" cy="160" r="7" fill="#06b6d4" filter="url(#subtleGlow)" />
      <circle cx="156" cy="160" r="4.5" fill="#22d3ee" />
      <circle cx="156" cy="160" r="2" fill="#e0f2fe" />

      <circle cx="178" cy="160" r="5" fill="#3b82f6" opacity="0.8" />
      <circle cx="178" cy="160" r="3" fill="#60a5fa" />

      <!-- Rejillas de Ventilación / Fibra Óptica (Centro) -->
      <rect x="216" y="152" width="28" height="16" rx="4" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
      <line x1="223" y1="155" x2="223" y2="165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="230" y1="155" x2="230" y2="165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="237" y1="155" x2="237" y2="165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- Ranuras de Almacenamiento SSD NVMe (Derecha) -->
      <rect x="264" y="150" width="40" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <line x1="294" y1="160" x2="298" y2="160" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
      
      <rect x="314" y="150" width="40" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <line x1="344" y1="160" x2="348" y2="160" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />

      <!-- Botón de Encendido / Pulsador (Extremo Derecho) -->
      <circle cx="388" cy="160" r="9" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <path d="M 388 155 L 388 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <path d="M 384.5 157.5 A 5 5 0 1 0 391.5 157.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- ================= BLADE 2 (CENTRAL - NÚCLEO ACTIVO) ================= -->
    <g transform="translate(0, 92)">
      <!-- Chasis del Servidor -->
      <rect x="96" y="126" width="320" height="68" rx="16" fill="url(#bladeGradMid)" stroke="url(#borderGrad)" stroke-width="2.5" />
      <!-- Bisel de Luz Superior Neón -->
      <line x1="112" y1="128" x2="400" y2="128" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" filter="url(#subtleGlow)" />
      
      <!-- LEDs de Estado (Izquierda) -->
      <circle cx="132" cy="160" r="8" fill="#06b6d4" filter="url(#neonGlow)" />
      <circle cx="132" cy="160" r="5" fill="#22d3ee" />
      <circle cx="132" cy="160" r="2.5" fill="#ffffff" />

      <circle cx="156" cy="160" r="7" fill="#3b82f6" filter="url(#subtleGlow)" />
      <circle cx="156" cy="160" r="4.5" fill="#60a5fa" />
      <circle cx="156" cy="160" r="2" fill="#eff6ff" />

      <circle cx="178" cy="160" r="6" fill="#10b981" filter="url(#subtleGlow)" />
      <circle cx="178" cy="160" r="3.5" fill="#34d399" />

      <!-- Puertos de Red Gigabit SFP+ Dual (Centro) -->
      <rect x="214" y="149" width="22" height="22" rx="4" fill="#020617" stroke="#0284c7" stroke-width="1.5" />
      <rect x="220" y="155" width="10" height="10" rx="1.5" fill="#22d3ee" filter="url(#subtleGlow)" />
      
      <rect x="244" y="149" width="22" height="22" rx="4" fill="#020617" stroke="#0284c7" stroke-width="1.5" />
      <rect x="250" y="155" width="10" height="10" rx="1.5" fill="#22d3ee" filter="url(#subtleGlow)" />

      <!-- Indicador de Tráfico en Tiempo Real -->
      <g transform="translate(284, 150)">
        <rect x="0" y="0" width="70" height="20" rx="4" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" />
        <!-- Barras de Nivel de Tráfico -->
        <line x1="12" y1="16" x2="12" y2="12" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
        <line x1="22" y1="16" x2="22" y2="8" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
        <line x1="32" y1="16" x2="32" y2="5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <line x1="42" y1="16" x2="42" y2="9" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
        <line x1="52" y1="16" x2="52" y2="4" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
        <line x1="60" y1="16" x2="60" y2="7" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Botón de Encendido / Pulsador (Extremo Derecho) -->
      <circle cx="388" cy="160" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#subtleGlow)" />
      <path d="M 388 155 L 388 160" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M 384.5 157.5 A 5 5 0 1 0 391.5 157.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- ================= BLADE 3 (INFERIOR - STORAGE & POWER) ================= -->
    <g transform="translate(0, 184)">
      <!-- Chasis del Servidor -->
      <rect x="96" y="126" width="320" height="68" rx="16" fill="url(#bladeGradBot)" stroke="url(#bladeBorderGrad)" stroke-width="2.5" />
      <!-- Bisel de Luz Superior -->
      <line x1="112" y1="128" x2="400" y2="128" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
      
      <!-- LEDs de Estado (Izquierda) -->
      <circle cx="132" cy="160" r="7" fill="#3b82f6" filter="url(#subtleGlow)" />
      <circle cx="132" cy="160" r="4.5" fill="#60a5fa" />
      <circle cx="132" cy="160" r="2" fill="#eff6ff" />

      <circle cx="156" cy="160" r="8" fill="#10b981" filter="url(#neonGlow)" />
      <circle cx="156" cy="160" r="5" fill="#34d399" />
      <circle cx="156" cy="160" r="2.5" fill="#ffffff" />

      <circle cx="178" cy="160" r="5" fill="#06b6d4" opacity="0.8" />
      <circle cx="178" cy="160" r="3" fill="#22d3ee" />

      <!-- Banco de 4 Bahías de Discos Hot-Swap -->
      <g transform="translate(210, 148)">
        <rect x="0" y="0" width="30" height="24" rx="3" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
        <circle cx="8" cy="12" r="2" fill="#10b981" />
        <line x1="15" y1="12" x2="25" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />

        <rect x="36" y="0" width="30" height="24" rx="3" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
        <circle cx="44" cy="12" r="2" fill="#10b981" />
        <line x1="51" y1="12" x2="61" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />

        <rect x="72" y="0" width="30" height="24" rx="3" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
        <circle cx="80" cy="12" r="2" fill="#22d3ee" />
        <line x1="87" y1="12" x2="97" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />

        <rect x="108" y="0" width="30" height="24" rx="3" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
        <circle cx="116" cy="12" r="2" fill="#22d3ee" />
        <line x1="123" y1="12" x2="133" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Botón de Encendido / Pulsador (Extremo Derecho) -->
      <circle cx="388" cy="160" r="9" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <path d="M 388 155 L 388 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <path d="M 384.5 157.5 A 5 5 0 1 0 391.5 157.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- INTERCONEXIONES VERTICALES DE FIBRA / BUS DE DATOS (LATERAL IZQUIERDA) -->
    <path d="M 78 160 L 96 160" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 78 252 L 96 252" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
    <path d="M 78 344 L 96 344" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 78 160 L 78 344" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="78" cy="252" r="5" fill="#22d3ee" filter="url(#subtleGlow)" />

    <!-- INTERCONEXIONES LATERAL DERECHA -->
    <path d="M 416 160 L 434 160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 416 252 L 434 252" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
    <path d="M 416 344 L 434 344" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 434 160 L 434 344" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="434" cy="252" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
  </g>

  <!-- REFLEJO DE CRISTAL / LUXURY SPECULAR HIGHLIGHT (DIAGONAL SUPERIOR) -->
  <path d="M 28 140 C 28 80, 80 28, 140 28 L 372 28 C 432 28, 484 80, 484 140 L 484 190 L 28 350 Z" fill="url(#glassSheen)" pointer-events="none" />
</svg>
