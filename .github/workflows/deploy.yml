name: Deploy to Production

on:
  push:
    branches: [ main ] # O 'master' según sea tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /ruta/a/tu/proyecto/en/el/servidor
            git pull origin main
            # Opcional: comandos extra si necesitas compilar o instalar dependencias
            # npm install
            # npm run build
